name: Build AppMaker Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.appmaker --project-name appmaker

      - name: Build standalone offline reader template
        working-directory: engine/flutter_template
        run: |
          flutter create . --platforms=android --org com.appmaker.generated --project-name generated_reader
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Verify standalone reader APK contents and signature
        run: |
          APK=engine/flutter_template/build/app/outputs/flutter-apk/app-release.apk
          python3 tools/verify_template_apk.py "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

      - name: Package offline reader template inside AppMaker
        run: |
          mkdir -p assets
          cp engine/flutter_template/build/app/outputs/flutter-apk/app-release.apk assets/offline_template.apk
          test -s assets/offline_template.apk

      - name: Install AppMaker dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify AppMaker APK archive, signature and alignment
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          python3 -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); sys.exit(('Corrupt APK entry: '+bad) if bad else 0)" "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appmaker-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
