name: Build AppMaker Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.appmaker --project-name appmaker

      - name: Build standalone offline reader template
        working-directory: engine/flutter_template
        run: |
          flutter create . --platforms=android --org com.appmaker.generated --project-name generated_reader
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Verify standalone reader APK contents
        run: python3 tools/verify_template_apk.py engine/flutter_template/build/app/outputs/flutter-apk/app-release.apk

      - name: Package offline reader template inside AppMaker
        run: |
          mkdir -p assets
          cp engine/flutter_template/build/app/outputs/flutter-apk/app-release.apk assets/offline_template.apk
          test -s assets/offline_template.apk

      - name: Install AppMaker dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify AppMaker APK archive integrity
        run: python3 -c "import sys,zipfile; p='build/app/outputs/flutter-apk/app-release.apk'; z=zipfile.ZipFile(p); bad=z.testzip(); sys.exit(('Corrupt APK entry: '+bad) if bad else 0)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appmaker-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
